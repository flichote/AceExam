# AceExam Alembic 迁移配置（ep-db 交付，M1）
# 数据库连接串通过环境变量 DATABASE_URL 提供（.env 不入库）：
#   postgresql+psycopg://aceexam:aceexam@localhost:5432/aceexam
[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url 不写死；env.py 优先读 DATABASE_URL 环境变量
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
