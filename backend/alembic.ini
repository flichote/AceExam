# AceExam Alembic configuration (delivered by ep-db, M1)
# DB connection string is provided via DATABASE_URL env var (.env is NOT committed):
#   postgresql+psycopg://aceexam:aceexam@localhost:5432/aceexam
[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is NOT hardcoded here; env.py prefers DATABASE_URL env var
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
